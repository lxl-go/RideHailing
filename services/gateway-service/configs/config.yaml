server:
  http:
    addr: 0.0.0.0:9000
    timeout: 15s
registry:
  nacos:
    enabled: false
    server_addr: 127.0.0.1
    server_port: 8848
    namespace_id: public
    group: DEFAULT_GROUP
    username: nacos
    password: nacos
    timeout_ms: 5000
auth:
  jwt:
    enabled: true
    secret: ride-hailing-dev-secret-change-me # 本地联调 JWT 密钥；上线请替换为新的强随机密钥
    issuer: ride-hailing
    expire_seconds: 7200
    compatible_header_enabled: false
  permission:
    cache_ttl: 30s
    failure_threshold: 3
    circuit_open_ttl: 10s
clients:
  auth:
    endpoint: discovery:///auth-service
    http_base_url: http://127.0.0.1:9010
  trip:
    endpoint: discovery:///trip-service
    http_base_url: http://127.0.0.1:9040
  order:
    endpoint: discovery:///order-service
    http_base_url: http://127.0.0.1:9050
  review:
    endpoint: discovery:///review-service
    http_base_url: http://127.0.0.1:9060
  passenger:
    endpoint: discovery:///passenger-service
    http_base_url: http://127.0.0.1:9020
  driver:
    endpoint: discovery:///driver-service
    http_base_url: http://127.0.0.1:9030
alipay:
  app_id: "9021000161685035"
  private_key: ""
  alipay_public_key: ""
  production: false
  notify_url: "http://5f5a8fe7.r22.cpolar.top/api/v1/pay/notify"
  return_url: "http://5f5a8fe7.r22.cpolar.top/pay/success"
amap:
  web_key: "22ba26c4d757d904aef8138acda60ab7"
  timeout: 5s
